<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - AI Record Management</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e0121b;--dark:#8f0a10;--ink:#0b0b0b}
body{min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;color:#fff;background-color:#101010;background-image:radial-gradient(circle,rgba(255,255,255,.13) 1.5px,transparent 1.7px),repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 46px);background-size:13px 13px,auto}
nav{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 48px}
.brand{font-family:Impact,"Arial Black",sans-serif;font-size:1.6rem;letter-spacing:.08em;color:#fff;text-decoration:none;text-shadow:3px 3px 0 var(--red)}
.links{display:flex;align-items:center;gap:30px}
.links a{color:#fff;text-decoration:none;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.links a:hover,.links a.active{opacity:1;color:var(--red)}
.web{position:fixed;top:0;right:0;width:360px;height:360px;opacity:.28;z-index:1;pointer-events:none}
.wrap{position:relative;z-index:3;max-width:860px;margin:10px auto 60px;padding:0 20px}
.title{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(3rem,10vw,6.5rem);line-height:1;text-transform:uppercase;transform:skew(-8deg);color:#fff;text-shadow:5px 5px 0 var(--red),9px 9px 0 #000;margin-bottom:6px}
.title span{color:var(--red);text-shadow:5px 5px 0 #fff,9px 9px 0 #000}
.sub{letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;opacity:.85;margin:0 0 26px 6px}
.panel{background:#fff;color:#111;border:5px solid #000;border-radius:6px;padding:30px;box-shadow:12px 12px 0 var(--red)}
.drop{display:block;border:4px dashed var(--red);border-radius:6px;padding:44px 20px;text-align:center;background:#fff5f5;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:#ffe3e3;transform:rotate(-.6deg)}
.drop input{display:none}
.drop .big{font-family:Impact,"Arial Black",sans-serif;font-size:1.8rem;letter-spacing:.06em;text-transform:uppercase;color:#000}
.drop .hint{color:#555;margin-top:6px;font-size:.92rem}
#fname{margin-top:12px;font-weight:700;color:var(--red);word-break:break-all}
.actions{margin-top:24px;text-align:center}
.btn{display:inline-block;font-family:Impact,"Arial Black",sans-serif;font-size:1.25rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#fff;background:var(--red);border:4px solid #000;padding:12px 38px;cursor:pointer;transform:skew(-6deg);box-shadow:6px 6px 0 #000;transition:.12s}
.btn:hover{transform:skew(-6deg) translate(-2px,-2px);box-shadow:9px 9px 0 #000}
.btn.alt{background:#fff;color:#000}
.loading{display:none;margin-top:22px;text-align:center}
.pow{display:inline-block;font-family:Impact,"Arial Black",sans-serif;font-size:1.4rem;letter-spacing:.08em;background:#ffe600;color:#000;border:4px solid #000;padding:8px 22px;transform:rotate(-3deg);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:rotate(2deg) scale(1.08)}}
.result{margin-top:34px;padding-top:26px;border-top:4px solid #000}
.result h2{font-family:Impact,"Arial Black",sans-serif;font-size:2rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:3px solid #000;padding:12px 14px;box-shadow:5px 5px 0 #000}
.stat .label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#666}
.stat .value{font-weight:800;font-size:1.05rem;margin-top:4px;word-break:break-word}
.badge{display:inline-block;background:var(--red);color:#fff;border:2px solid #000;padding:2px 12px;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#e8e8e8;border:3px solid #000;padding:14px;max-height:260px;overflow:auto;font-size:.86rem;margin-bottom:22px}
@media(max-width:700px){nav{padding:16px 20px}.links a:not(.active){display:none}.panel{padding:20px;box-shadow:8px 8px 0 var(--red)}}
</style></head>
<body>
<svg class="web" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="1.5">
<path d="M360 0 L0 0 M360 0 L360 360 M360 0 L0 140 M360 0 L0 300 M360 0 L130 360 M360 0 L260 360"/>
<path d="M300 0 Q290 60 360 70 M230 0 Q220 120 360 140 M160 0 Q150 180 360 210 M90 0 Q80 250 360 290"/>
</svg>
<nav>
<a class="brand" href="/">AI RECORDS</a>
<div class="links"><a href="/">Home</a><a class="active" href="/upload">Upload</a><a href="/records">Records</a></div>
</nav>
<div class="wrap">
<div class="title">Up<span>load</span></div>
<div class="sub">Drop it in &middot; AI reads it &middot; Done</div>
<div class="panel">
<form method="POST" enctype="multipart/form-data" id="uploadForm">
<label class="drop" id="drop">
<div class="big">Drop your record here</div>
<div class="hint">or click to browse. PDF, PNG, JPG, BMP, TIFF, TXT</div>
<div id="fname"></div>
<input type="file" name="file" id="file" required>
</label>
<div class="actions"><button class="btn" type="submit">Upload and Classify</button></div>
<div class="loading" id="loading"><span class="pow">Analyzing...</span></div>
</form>
{% if success %}
<div class="result">
<h2>Result</h2>
<div class="stats">
<div class="stat"><div class="label">File</div><div class="value">{{ original_name }}</div></div>
<div class="stat"><div class="label">Type</div><div class="value"><span class="badge">{{ record_type }}</span></div></div>
<div class="stat"><div class="label">Confidence</div><div class="value">{{ confidence }}%</div></div>
<div class="stat"><div class="label">Department</div><div class="value">{{ department }}</div></div>
<div class="stat"><div class="label">Date found</div><div class="value">{{ date_found }}</div></div>
</div>
<pre>{{ text_preview }}</pre>
<a class="btn alt" href="/records">View all records</a>
</div>
{% endif %}
</div>
</div>
<script>
var f=document.getElementById("file"),d=document.getElementById("drop");
f.addEventListener("change",function(){document.getElementById("fname").textContent=f.files.length?f.files[0].name:"";});
["dragover","dragenter"].forEach(function(e){d.addEventListener(e,function(v){v.preventDefault();d.classList.add("over");});});
["dragleave","drop"].forEach(function(e){d.addEventListener(e,function(v){v.preventDefault();d.classList.remove("over");});});
d.addEventListener("drop",function(v){if(v.dataTransfer.files.length){f.files=v.dataTransfer.files;f.dispatchEvent(new Event("change"));}});
document.getElementById("uploadForm").addEventListener("submit",function(){document.getElementById("loading").style.display="block";});
</script>
</body></html>
